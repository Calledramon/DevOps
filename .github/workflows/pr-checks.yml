name: PR-Checks

# Runs on every pull request, including the ones Dependabot opens
on:
  pull_request:
    branches: [ main ]

# least privilege: this workflow only needs to read the code
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install dependencies
        run: npm install
      - name: Lint (ESLint + security rules)
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
